<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
</head>
<body>
     <div class="container">
          <div class="row">
               <div class="col-6">
               <div class="mb-3">
                    <form>
                         <div class="form-group pt-4">
                              <label for="num1">X1:</label>
                              <input [(ngModel)]="x2" name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese x1">
                         </div>
                         <div class="form-group pt-4">
                              <label for="num1">X2:</label>
                              <input [(ngModel)]="y2" name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese x2">
                              </div>
                         <div class="form-group pt-4">
                              <label for="num1">Y1:</label>
                              <input [(ngModel)]="x1" name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese y1">
                              </div>
                         <div class="form-group pt-4">
                              <label for="num1">Y2:</label>
                              <input [(ngModel)]="y1" name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese y2">
                              </div>
                              <br>
                              <button (click)="distancia()" type="button" class="btn btn-primary">
                                   Calcular
                              </button>
                         </form>
                    </div>
                    <div class="col-6">
                         <h3>Resultado: {{resultado}}</h3>
                    </div>
               </div>
          </div>
     </div>
</body>
</html>
